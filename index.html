<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nachtzehrer</title>
<style>
  /* Der Hintergrund ist der Rand um das Bild — er muss dunkler sein als
     die dunkelste Stelle im Spiel, sonst wirkt das Bild grau. */
  html, body {
    margin: 0; height: 100%;
    background: #050409;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* `pixelated` ist der eine Schalter, ohne den die ganze Mühe mit dem
     Bildpunktraster umsonst wäre: Der Browser würde beim Vergrößern
     glätten und aus harten Kanten Verläufe machen. */
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
</style>
</head>
<body>
  <canvas id="bild"></canvas>
  <script type="module" src="runtime/start.js"></script>
</body>
</html>
