<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Shadows Crawl</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050409">
<!-- Apple kennt das Manifest nicht; ohne diese drei Zeilen startet
     ein iPhone die App mit Adressleiste. -->
<!-- Chrome meldet die Apple-Zeile als veraltet in die Konsole und
     moechte diese hier daneben. Sichtbar aendert sich nichts — das
     Verhalten steuert das Manifest —, aber wer spaeter mit offener
     Konsole sucht, faende sonst zuerst eine Warnung, die keine ist. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadows">
<link rel="apple-touch-icon" href="symbole/symbol-192.png">
<style>
  /* [Aufgabe: Bedienung] Der Rahmen um das Bild und die Bedienung fuer den Daumen.

     Der Hintergrund ist der Rand um das Bild — er muss dunkler sein als
     die dunkelste Stelle im Spiel, sonst wirkt das Bild grau. */
  html, body {
    margin: 0; height: 100%;
    background: #050409;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    /* Ohne das scrollt und zoomt die Seite unter dem Daumen weg, sobald
       jemand den Stick zieht: Der Browser deutet den Zug als Wischen.
       `none` sagt ihm, dass diese Seite ihre Gesten selbst auswertet. */
    touch-action: none;
    /* Ein langer Druck markierte sonst Text oder oeffnete das
       Nachschlagen-Menue — mitten im Ausweichen. */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, sans-serif;
  }
  /* `pixelated` ist der eine Schalter, ohne den die ganze Mühe mit dem
     Bildpunktraster umsonst wäre: Der Browser würde beim Vergrößern
     glätten und aus harten Kanten Verläufe machen. */
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    touch-action: none;
  }

  /* ── Bedienung fuer den Daumen ──────────────────────────────────────

     Liegt ueber dem Bild und wird nur eingeblendet, wenn das Geraet
     wirklich Beruehrung meldet — auf dem Schreibtisch soll nichts im
     Bild stehen. Geschaltet wird ueber `hidden`, nicht ueber `style`. */
  #bedienung {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #bedienung[hidden] { display: none !important; }

  /* Die ganze linke Haelfte nimmt den Stick an. Ein kleines festes Feld
     waere auf einem Telefon zu treffen schwer; so setzt der Daumen die
     Mitte dort, wo er zuerst aufkommt. */
  #stickfeld {
    position: absolute; left: 0; top: 0; bottom: 0; width: 50%;
    pointer-events: auto; touch-action: none;
  }
  #stickring, #stickknopf {
    position: absolute; border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0; transition: opacity .12s;
  }
  #stickring {
    width: 116px; height: 116px;
    border: 2px solid rgba(214,178,102,.45);
    background: rgba(10,8,18,.35);
  }
  #stickknopf {
    width: 52px; height: 52px;
    background: rgba(214,178,102,.72);
    box-shadow: 0 0 12px rgba(214,178,102,.35);
  }
  #bedienung.zieht #stickring, #bedienung.zieht #stickknopf { opacity: 1; }

  /* Der Knopf: ausweichen im Kampf, bestaetigen im Menue — derselbe
     Knopf, weil das Spiel nur einen kennt (runtime/eingabe.js). */
  /* ⚠️ Die Abstaende kommen aus dem **sicheren Bereich**, nicht aus
     festen Zahlen. Zeile 5 erlaubt der Seite mit `viewport-fit=cover`
     ausdruecklich, bis unter Kamera-Aussparung, runde Ecken und
     Gestenleiste zu zeichnen — ohne `env(safe-area-inset-*)` waere das
     eine Erlaubnis ohne Gegenstueck. Auf einem quer gehaltenen Pixel
     liegt der Knopf sonst halb auf der Gestenleiste. */
  #knopf {
    position: absolute;
    right: calc(22px + env(safe-area-inset-right));
    bottom: calc(26px + env(safe-area-inset-bottom));
    width: 96px; height: 96px; border-radius: 50%;
    pointer-events: auto; touch-action: none;
    border: 2px solid rgba(214,178,102,.5);
    background: rgba(28,20,44,.55);
    color: rgba(214,178,102,.9);
    font-size: 13px; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center;
  }
  #knopf.gedrueckt {
    background: rgba(214,178,102,.35);
    color: #14101f;
  }

  /* Hochkant bleibt vom Bild wenig uebrig — der Hinweis sagt, warum. */
  /* Der Hinweis ist das **einzige** Element, das ueberhaupt jemals
     hochkant erscheint — also genau in der Lage, in der die
     Loch-Kamera oben mittig sitzt. Ohne den sicheren Bereich stand
     „BITTE QUER HALTEN" auf einem Pixel hinter der Kamera. */
  #querhinweis {
    position: absolute; left: 0; right: 0;
    top: calc(12px + env(safe-area-inset-top));
    text-align: center;
    color: rgba(214,178,102,.85);
    font-size: 13px; letter-spacing: 2px;
    text-shadow: 0 1px 3px #000;
  }
  #querhinweis[hidden] { display: none !important; }

  /* ── Lobby ──────────────────────────────────────────────────────────

     Bewusst HTML statt Leinwand: Hier wird ein Code getippt, und ein
     Eingabefeld auf einer Leinwand nachzubauen hiesse, Tastatur,
     Einfuegen und die Bildschirmtastatur des Telefons selbst zu
     bauen. Der Browser kann das alles schon. */
  #lobby {
    position: fixed; inset: 0; z-index: 20;
    background: #07060c;
    color: #cfc6de;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    padding:
      calc(20px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(20px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    overflow-y: auto;
    text-align: center;
  }
  #lobby[hidden] { display: none !important; }
  #lobby h1 {
    margin: 0 0 4px; font-size: 22px; letter-spacing: 3px;
    color: #e8b661; font-weight: 600;
  }
  #lobby p { margin: 0; font-size: 13px; line-height: 1.5; max-width: 30em; }
  .matt { color: #7d7391; }
  #lobby button {
    min-width: 220px; min-height: 48px;
    border: 1px solid rgba(214,178,102,.45);
    background: rgba(28,20,44,.7); color: #e8b661;
    font-size: 14px; letter-spacing: 1px; border-radius: 4px;
  }
  #lobby button:disabled { opacity: .4; }
  #lobby input {
    min-height: 48px; width: 220px;
    text-align: center; font-size: 22px; letter-spacing: 6px;
    text-transform: uppercase;
    border: 1px solid rgba(214,178,102,.45); border-radius: 4px;
    background: #100c1a; color: #e8b661;
  }
  #lobbycode {
    font-size: 34px; letter-spacing: 10px; color: #e8b661;
    padding: 10px 4px 10px 14px;
    border: 1px dashed rgba(214,178,102,.4); border-radius: 6px;
  }
  /* Der Installieren-Knopf. Bewusst leiser als die drei Knöpfe darüber:
     Wer im Vorspiel steht, will meistens spielen. Er ist nur da, wenn
     der Browser die Installation wirklich anbietet — geschaltet über
     `hidden` aus `runtime/lobby.js`, nicht über `style`. */
  #installkasten {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    margin-top: 6px;
  }
  #installkasten[hidden] { display: none !important; }
  #installkasten p { font-size: 12px; max-width: 26em; }
  #lobby button#installknopf {
    min-height: 44px;
    border-color: rgba(214,178,102,.28);
    background: transparent;
    color: rgba(232,182,97,.75);
    font-size: 13px;
  }

  #lobbyliste { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  #lobbyliste li { padding: 3px 0; }
  #lobbymeldung { color: #c2607a; font-size: 13px; min-height: 1.2em; max-width: 30em; }
  .reihe { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
  <canvas id="bild"></canvas>

  <div id="bedienung" hidden>
    <div id="stickfeld"></div>
    <div id="stickring"></div>
    <div id="stickknopf"></div>
    <div id="knopf">AUSWEICHEN</div>
    <div id="querhinweis" hidden>BITTE QUER HALTEN</div>
  </div>

  <div id="lobby" hidden></div>

  <script type="module" src="runtime/start.js"></script>

  <!-- Der Dienst macht die App installierbar und offline spielbar.
       Bewusst NACH dem Spiel und in einem eigenen Block: Faellt er aus
       — kein HTTPS, abgeschaltet, alte Browserfassung —, laeuft das
       Spiel unveraendert weiter. Ein `await` davor haette genau das
       verhindert. -->
  <script>
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
